# The draft.inator demo site: real Sveltia CMS with its built-in test backend. Everything is kept in this browser's
# private storage; nothing is published. The seed (seed/manifest.json) fills it on the first visit.
backend:
  name: test-repo
media_folder: static/uploads
public_folder: /uploads
collections:
  - name: essays
    label: Essays
    folder: content/essays
    create: true
    extension: md
    format: frontmatter
    fields:
      - { name: title, label: Title, widget: string, required: false }
      - { name: body, label: Body, widget: markdown }
